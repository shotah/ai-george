<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="george — a CLI coding agent. It reads your files and edits your code.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1316"/>
      <stop offset="60%" stop-color="#12181c"/>
      <stop offset="100%" stop-color="#1a1412"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#f07848" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f07848" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f07848" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win">
      <rect x="48" y="68" width="1184" height="328" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="640" cy="250" rx="420" ry="150" fill="url(#glow)"/>

  <g font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace" text-anchor="middle">
    <text x="640" y="30" fill="#f07848" font-size="16" font-weight="700" letter-spacing="6">GEORGE</text>
    <text x="640" y="52" fill="#a8a29e" font-size="12" letter-spacing="3.4">CLI CODING AGENT</text>
  </g>

  <g filter="url(#soft)">
    <rect x="48" y="68" width="1184" height="328" rx="12" fill="#0e1014"/>
  </g>

  <g clip-path="url(#win)" font-family="ui-monospace, SFMono-Regular, 'DejaVu Sans Mono', Menlo, Consolas, monospace">
    <rect x="48" y="68" width="1184" height="328" fill="#0e1014"/>
    <rect x="48" y="68" width="1184" height="44" fill="#1a1e24"/>
    <text x="76" y="96" fill="#fafaf9" font-size="16" font-weight="700">george</text>
    <text x="168" y="96" fill="#78716c" font-size="13">stdio</text>
    <text x="1184" y="96" text-anchor="end" fill="#f07848" font-size="12" letter-spacing="1.6">your files · your code</text>

    <rect x="48" y="112" width="260" height="208" fill="#12161a"/>
    <text x="72" y="140" fill="#78716c" font-size="11" letter-spacing="2.2">FILES</text>

    <g font-size="14">
      <text x="72" y="168" fill="#d6d3d1">cmd/</text>
      <text x="92" y="192" fill="#a8a29e">main.go</text>
      <text x="72" y="220" fill="#d6d3d1">internal/</text>
      <text x="92" y="244" fill="#a8a29e">loop.go</text>
      <rect x="60" y="256" width="236" height="26" rx="4" fill="#2a1814"/>
      <rect x="60" y="256" width="3" height="26" rx="1" fill="#f07848"/>
      <text x="92" y="274" fill="#f07848" font-weight="700">parser.go</text>
      <text x="92" y="302" fill="#a8a29e">store.go</text>
    </g>

    <line x1="308" y1="112" x2="308" y2="320" stroke="#27272a" stroke-width="1"/>

    <text x="332" y="140" fill="#e7e5e4" font-size="13" font-weight="700">parser.go</text>
    <rect x="430" y="124" width="54" height="20" rx="4" fill="#132421" stroke="#3db8a0" stroke-width="1"/>
    <text x="457" y="138" text-anchor="middle" fill="#3db8a0" font-size="11" font-weight="700">read</text>
    <rect x="492" y="124" width="54" height="20" rx="4" fill="#2a1814" stroke="#f07848" stroke-width="1"/>
    <text x="519" y="138" text-anchor="middle" fill="#f07848" font-size="11" font-weight="700">edit</text>

    <g font-size="14">
      <rect x="320" y="222" width="888" height="22" fill="#241610"/>
      <rect x="320" y="222" width="3" height="22" fill="#f07848"/>

      <g fill="#57534e" text-anchor="end">
        <text x="360" y="166">41</text>
        <text x="360" y="190">42</text>
        <text x="360" y="214">43</text>
        <text x="360" y="238" fill="#f07848">44</text>
        <text x="360" y="262">45</text>
        <text x="360" y="286">46</text>
      </g>

      <text xml:space="preserve" x="376" y="166" fill="#e7e5e4"><tspan fill="#f07848">func</tspan><tspan> Parse(line string) (Cmd, error) {</tspan></text>
      <text xml:space="preserve" x="376" y="190" fill="#a8a29e">    fields := strings.Fields(line)</text>
      <text xml:space="preserve" x="376" y="214" fill="#e7e5e4"><tspan fill="#f07848">if</tspan><tspan> len(fields) == 0 {</tspan></text>
      <text xml:space="preserve" x="376" y="238" fill="#fde6dc"><tspan fill="#f07848">return</tspan><tspan> Cmd{}, ErrEmpty</tspan></text>
      <text xml:space="preserve" x="376" y="262" fill="#a8a29e">    return Cmd{Name: fields[0]}, nil</text>
      <text xml:space="preserve" x="376" y="286" fill="#a8a29e">}</text>
    </g>

    <rect x="48" y="320" width="1184" height="76" fill="#161a1f"/>
    <line x1="48" y1="320" x2="1232" y2="320" stroke="#27272a"/>
    <polygon points="76,346 90,356 76,366" fill="#f07848"/>
    <text x="104" y="360" fill="#fafaf9" font-size="18">fix the empty-line case</text>
    <text xml:space="preserve" x="76" y="386" font-size="13"><tspan fill="#3db8a0">read</tspan><tspan fill="#a8a29e">  parser.go</tspan><tspan fill="#57534e">    ·    </tspan><tspan fill="#f07848">edit</tspan><tspan fill="#a8a29e">  parser.go</tspan><tspan fill="#57534e">    ·    </tspan><tspan fill="#e7e5e4">go test ./...</tspan></text>
  </g>

  <rect x="48" y="68" width="1184" height="328" rx="12" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
</svg>
