# Live MCP catalogs for the behavioral eval — docs/eval_setup.md.
#
# A fixture with `tools_from = ["fs"]` gets that server's real tool
# names, descriptions, and schemas from here at run time: `tools-fetch`
# pulls the latest release, the host boots it, tools/list is the contract.
# Nothing is checked in and nothing is called — results stay canned — so the
# env values below only satisfy each binary's "key is required" startup
# check. A sibling release that renames a tool fails the fixture before any
# model call. Binaries cache under EVAL_MCP_BIN (default $TMPDIR/george-eval-mcp).

# Coding tools. GITHUB_TOKEN here only satisfies github-mcp startup;
# the eval never calls the API. --root is the eval process cwd.

[[server]]
name    = "fs"
command = "fs-mcp"
args    = ["--root", ".", "--tool-tier", "core"]
force   = true
download_tag = "latest"
download_url = "https://github.com/shotah/fs-mcp/releases/download/{tag}/fs-mcp_{version}_{os}_{arch}.tar.gz"

[[server]]
name    = "git"
command = "git-mcp"
args    = ["--root", ".", "--tool-tier", "core"]
force   = true
download_tag = "latest"
download_url = "https://github.com/shotah/git-mcp/releases/download/{tag}/git-mcp_{version}_{os}_{arch}.tar.gz"

[[server]]
name    = "shell"
command = "shell-mcp"
args    = ["--root", "."]
force   = true
download_tag = "latest"
download_url = "https://github.com/shotah/shell-mcp/releases/download/{tag}/shell-mcp_{version}_{os}_{arch}.tar.gz"

[[server]]
name     = "github"
command  = "github-mcp"
env      = ["GITHUB_TOKEN=eval-placeholder"]
force    = true
download_tag = "latest"
download_url = "https://github.com/shotah/github-mcp/releases/download/{tag}/github-mcp_{version}_{os}_{arch}.tar.gz"
